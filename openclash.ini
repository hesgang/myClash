;策略组定义
# ===== 手动选择类 =====
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇩🇪 德国节点`[]🌍 其他节点
custom_proxy_group=🤖 AI`select`[]🚀 节点选择`[]🤖 AI专属`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇩🇪 德国节点`[]🌍 其他节点`[]DIRECT
