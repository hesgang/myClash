custom_proxy_group=🎮 游戏平台`select`[]🚀 节点选择`[]🤖 AI专属`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]🤖 AI专属`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛡️ 隐私防护`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🚀 节点选择

# ===== 自动测速类 =====
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🤖 AI专属`url-test`(ChatGPT|GPT|OpenAI|Claude|Gemini|AI)`http://www.gstatic.com/generate_204`300,,50

# ===== 地区分组 =====
custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|Hong Kong|HongKong|香港)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日|JP|Japan|日本)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(新加坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(美|US|United States|USA|美国)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇩🇪 德国节点`url-test`(德|DE|Germany|德国|德意志)`http://www.gstatic.com/generate_204`300,,50

# ===== 其他节点（放在最后）=====
custom_proxy_group=🌍 其他节点`url-test`(^(?!.*(港|HK|Hong Kong|HongKong|香港|日|JP|Japan|日本|新加坡|狮城|SG|Singapore|美|US|United States|USA|美国|德|DE|Germany|德国|德意志|ChatGPT|GPT|OpenAI|Claude|Gemini|AI)).*)$`http://www.gstatic.com/generate_204`300,,50

;启用自定义规则集

enable_rule_generator=true
overwrite_original_rules=true

